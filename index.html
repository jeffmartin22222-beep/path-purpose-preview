const $=x=>document.querySelector(x);let state={page:0,done:{},answers:{},tests:[],mem:[],cargo:0,plant:false,animal:false,notes:'',assess:{},videoSeen:{}};try{state={...state,...JSON.parse(localStorage.getItem('pp_studio_v12')||'{}')}}catch(e){}const save=()=>localStorage.setItem('pp_studio_v12',JSON.stringify(state));const titles=['Welcome to the cell','Video: Cell tour','Cell explorer','Video: The membrane','Membrane transport lab','Video: Protein journey','Protein delivery game','Video: Cellular energy','Energy investigation','Plant vs. animal cells','Scientific reflection','Final assessment','Your learning record'];const n=titles.length;const completed=()=>!!state.done[state.page];function mark(){state.done[state.page]=true;save();render()}function setPage(p){const previous=state.page;state.page=Math.max(0,Math.min(n-1,p));if(previous!==state.page){state.videoChoice=null;state.videoWrong=false;state.videoFeedback="";transportRunId++;labRunToken++;}save();render()}function button(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function left(tag,title,body,directions){return `<div class="eyebrow">${tag}</div><h1>${title}</h1><p>${body}</p><div class="hint"><b>YOUR NEXT STEP</b><div>${directions}</div></div><div class="row"><span class="pill">${Object.keys(state.done).length} activities complete</span><span class="pill">${state.page+1} / ${n} screens</span></div>`}function panel(x){return `<div class="panel">${x}</div>`}const transcripts={'01_cell_tour':'Every cell is a busy system. Different structures have different jobs. The nucleus holds DNA instructions. Ribosomes use messages to build proteins. Mitochondria help supply ATP. The membrane controls what enters and leaves.','02_membrane':'A cell membrane is selectively permeable. Not everything crosses in the same way. Small nonpolar oxygen can diffuse through. Charged ions need membrane proteins. A transporter helps glucose enter. Try changing the channels yourself.','03_protein':'DNA instructions are copied into RNA. Ribosomes read the message. Many exported proteins enter the rough ER. They fold and move toward the Golgi. The Golgi modifies and sorts cargo. Vesicles carry it toward the membrane.','04_energy':'Cells need usable energy called ATP. Mitochondria are key sites of respiration. Oxygen supports aerobic respiration. Glucose provides fuel for the process. What happens when supplies run low? Test two conditions in the energy lab.'};const videoChecks={
 '01_cell_tour':{q:'Which structure contains most of a eukaryotic cell’s DNA?',a:['Golgi apparatus','Nucleus','Ribosome'],correct:1,why:'The nucleus houses most of the DNA in a eukaryotic cell.'},
 '02_membrane':{q:'Why can a sodium ion not cross the lipid bilayer as readily as oxygen?',a:['It is charged and needs a suitable transport protein','It is too heavy for the cell','The membrane has no lipids'],correct:0,why:'The hydrophobic interior of the lipid bilayer resists charged ions; a selective channel can allow passage.'},
 '03_protein':{q:'What happens to many proteins destined for secretion after the rough ER?',a:['They become DNA','They are sorted and processed in the Golgi','They become chloroplasts'],correct:1,why:'Proteins commonly move in vesicles from the ER to the Golgi for further processing and sorting.'},
 '04_energy':{q:'What would usually happen to aerobic ATP production if oxygen became scarce?',a:['It would always increase','It would be unaffected','It would generally decrease'],correct:2,why:'Oxygen is the final electron acceptor in aerobic respiration, so shortages can limit ATP production.'}
};
function video(slug){const c=videoChecks[slug], ready=!!state.videoSeen[state.page];return panel(`<div class="eyebrow">Original narrated prototype video</div><video class="video" controls playsinline preload="metadata" src="media/${slug}.mp4" onended="videoEnd()"><track kind="captions" src="media/${slug}.vtt" srclang="en" label="English" default></video><p class="small">Narrated draft footage. Captions and a transcript are included. This is not yet the final animation or voice quality.</p><details id="transcript"><summary>Read the full transcript</summary><p>${transcripts[slug]}</p></details><div class="row">${button('Use transcript instead of video','useTranscript()')}</div><div class="task" style="margin-top:15px">Knowledge check: ${c.q}</div>${ready?`<div class="options">${c.a.map((a,i)=>button(a,`videoAnswer('${slug}',${i})`,state.videoChoice===i?'selected':'')).join('')}</div><div class="feedback ${state.videoWrong?'warn':''}" role="status">${state.videoFeedback||'Choose an answer. You can replay or review the transcript first.'}</div>`:`<div class="lesson-note" role="status">Watch the video to the end or choose the transcript alternative to reveal the knowledge check. You can replay whenever you need.</div>`}`)}

function useTranscript(){state.videoSeen[state.page]=true;save();render();const d=document.querySelector('#transcript');if(d)d.open=true}
function videoAnswer(slug,i){const c=videoChecks[slug];state.videoChoice=i;state.videoWrong=i!==c.correct;state.videoFeedback=(state.videoWrong?'Try again. ':'Correct. ')+c.why;if(!state.videoWrong)state.done[state.page]=true;render()}
function cellSVG(plant=false,interactive=false){return `<svg class="world" viewBox="0 0 600 315" role="img" aria-label="Interactive cell illustration"><rect width="600" height="315" fill="#071e32" rx="15"/>${plant?'<rect x="80" y="27" width="440" height="260" rx="25" fill="#2d6d55" stroke="#baff78" stroke-width="10"/>':''}<ellipse cx="300" cy="158" rx="${plant?198:210}" ry="${plant?107:124}" fill="#164459" stroke="#62e8e2" stroke-width="7"/><ellipse cx="278" cy="142" rx="70" ry="62" fill="#8264cb" stroke="#c1a9ff" stroke-width="4"/><ellipse cx="278" cy="142" rx="23" ry="20" fill="#463582"/><g fill="#ffa76f" stroke="#ffcd9e" stroke-width="3"><ellipse cx="174" cy="197" rx="43" ry="24" transform="rotate(-20 174 197)"/><ellipse cx="416" cy="111" rx="39" ry="23" transform="rotate(25 416 111)"/></g><path d="M347 134 Q390 98 433 138 Q388 173 348 149" fill="none" stroke="#82c7f6" stroke-width="12"/><path d="M379 196 q35 -29 75 0 m-75 19 q35 28 75 0" stroke="#ffad75" stroke-width="12" fill="none"/>${plant?'<ellipse cx="148" cy="93" rx="35" ry="20" fill="#64d36c" stroke="#baff78" stroke-width="4"/><ellipse cx="446" cy="232" rx="35" ry="20" fill="#64d36c" stroke="#baff78" stroke-width="4"/>':''}${interactive?`<g class="cell-hotspots" aria-label="Clickable cell structures"><circle cx="278" cy="142" r="65" fill="transparent" stroke="transparent" style="cursor:pointer" onclick="explore('Nucleus')"><title>Nucleus</title></circle><circle cx="174" cy="197" r="37" fill="transparent" stroke="transparent" style="cursor:pointer" onclick="explore('Mitochondrion')"><title>Mitochondrion</title></circle><circle cx="388" cy="140" r="37" fill="transparent" stroke="transparent" style="cursor:pointer" onclick="explore('Rough ER')"><title>Rough ER</title></circle><circle cx="417" cy="207" r="42" fill="transparent" stroke="transparent" style="cursor:pointer" onclick="explore('Golgi')"><title>Golgi</title></circle><circle cx="490" cy="160" r="20" fill="transparent" stroke="transparent" style="cursor:pointer" onclick="explore('Membrane')"><title>Membrane</title></circle></g>`:''}<g font-size="15" font-weight="bold"><text x="243" y="65">Nucleus</text><text x="100" y="244">Mitochondrion</text><text x="400" y="77">Rough ER</text><text x="420" y="259">Golgi</text>${plant?'<text x="105" y="68">Chloroplast</text>':''}</g></svg>`}function render(){let l='',r='';let p=state.page;switch(p){case 0:l=left('START HERE','A world inside every cell','Cells are busy systems. In this lesson you will explore structures, watch short videos, test ideas, move proteins, and explain what you discover.','Select Start exploring. You will always see what you need to complete before Next unlocks.');r=panel(`<h2>Ready to explore?</h2>${cellSVG()}<div class="row">${button('Start exploring →','mark()','primary')}</div><div class="feedback">About 20–30 minutes. Four original narrated draft clips, interactive labs, reflection, and final assessment.</div>`);break;
case 1:l=left('VIDEO 1','Meet the cell','Watch a short narrated introduction to cell structures.','Watch or read the transcript, then answer the knowledge check to unlock Next.');r=video('01_cell_tour');break;
case 2:l=left('EXPLORE','Tap the organelles','Explore the model. Each structure has a job.','Select at least three different organelles to unlock Next.');r=panel(`<h2>Interactive cell explorer</h2><p class="small">Tap a structure in the diagram or choose its accessible button below.</p>${cellSVG(false,true)}<div class="options">${['Nucleus','Mitochondrion','Rough ER','Golgi','Membrane'].map(x=>button(x,`explore('${x}')`,state.mem.includes(x)?'selected':'')).join('')}</div><div class="feedback">${state.cellInfo||'Tap an organelle name to discover its function.'}</div><div class="small">Explored ${state.mem.length} of 3 required structures.</div>`);break;
case 3:l=left('VIDEO 2','Who gets through?','The membrane controls what enters and leaves the cell. Watch before you test different particles.','Watch or read the transcript, then answer the knowledge check.');r=video('02_membrane');break;
case 4:l=left('INVESTIGATE','Why does a molecule cross?','A membrane does not act like a one-way door. Test selective permeability, a protein gate, and concentration gradients in a model where particles can move both directions.','Make a prediction, run four evidence conditions, and compare the results. A wrong prediction is useful evidence—not a penalty.');r=panel(membraneLabHTML());break;
case 5:l=left('VIDEO 3','From DNA to delivery','Follow the journey of a protein destined for secretion.','Watch or read the transcript, then answer the knowledge check.');r=video('03_protein');break;
case 6:l=left('GAME','Deliver the protein','A protein needs to reach the outside of the cell. Build the correct route, one stop at a time.','Click the next correct destination. The delivery animation progresses as you build the route.');r=panel(`<h2>Protein delivery game</h2><div class="task">Cargo route: DNA → ${['?','Ribosome → ?','Rough ER → ?','Golgi → ?','Cell membrane ✓'][state.cargo]}</div><svg class="world" viewBox="0 0 600 315"><rect width="600" height="315" fill="#071e32"/><path d="M55 165 H545" stroke="#41677b" stroke-width="12" stroke-dasharray="14 12"/>${['DNA','Ribosome','Rough ER','Golgi','Membrane'].map((x,i)=>`<circle cx="${60+i*120}" cy="165" r="${i<=state.cargo?33:27}" fill="${i<=state.cargo?'#74cba0':'#294b63'}" stroke="${i<=state.cargo?'#baff78':'#55788b'}" stroke-width="4"/><text x="${60+i*120}" y="215" text-anchor="middle" font-size="15">${x}</text>`).join('')}</svg><div class="options">${['Ribosome','Golgi','Membrane','Rough ER'].map(x=>button(x,`deliver('${x}')`)).join('')}</div><div class="feedback ${state.cargoWrong?'warn':''}">${state.cargoMsg||'The DNA instructions have been copied into RNA. Where does the message go next?'}</div>`);break;
case 7:l=left('VIDEO 4','Powering the cell','Mitochondria support cellular respiration and ATP production.','Watch or read the transcript, then answer the knowledge check.');r=video('04_energy');break;
case 8:l=left('INVESTIGATE','Power the cell','Try a balanced condition and an oxygen shortage. Compare how the simplified ATP model responds.','Change the sliders, then press Test. One test unlocks Next; try both to compare.');r=panel(`<h2>Cellular energy lab</h2><label>Oxygen supply <b id="oxyLabel">${state.oxy??80}%</b></label><input type="range" min="0" max="100" value="${state.oxy??80}" oninput="setSupply('oxy',this.value)"><label>Glucose supply <b id="gluLabel">${state.glu??80}%</b></label><input type="range" min="0" max="100" value="${state.glu??80}" oninput="setSupply('glu',this.value)"><div class="stats"><div class="stat"><b id="atp">${Math.round(Math.min(state.oxy??80,state.glu??80)*.92)}</b>ATP index</div><div class="stat"><b>${(state.tests||[]).length}</b>Tests</div><div class="stat"><b>${(state.tests||[]).some(t=>t.value<25)?'Yes':'—'}</b>Shortage tested</div></div><div class="row">${button('Balanced supplies',`preset(85,85)`)}${button('Oxygen shortage',`preset(10,85)`)}${button('Test condition',`energyTest()`,'primary')}</div><div class="feedback">${state.energyMsg||'Test the current condition to record an outcome.'}</div><div class="small">Illustrative teaching index, not a validated physiological prediction.</div>`);break;
case 9:l=left('COMPARE','Plant and animal cells','Both cell types share many organelles. Plant cells also have cell walls and, in photosynthetic tissues, chloroplasts.','Explore both models, then answer the question.');r=panel(`<h2>Explore both cell types</h2><div class="row">${button('🌱 Plant cell',`changeType('plant')`,state.type==='plant'?'selected':'')}${button('🐾 Animal cell',`changeType('animal')`,state.type==='animal'?'selected':'')}</div>${cellSVG(state.type==='plant')}<div class="task">Which structure captures light energy for photosynthesis?</div><div class="options">${button('Chloroplast',`compare('Chloroplast')`)}${button('Mitochondrion',`compare('Mitochondrion')`)}</div><div class="feedback ${state.compareWrong?'warn':''}">${state.compareMsg||'Explore both cell types before answering.'}</div>`);break;
case 10:l=left('REFLECT','Explain what you discovered','Imagine the Golgi stops working but ribosomes still make proteins. What happens to proteins that need to be secreted?','Write a scientific explanation using evidence from the videos and games, then submit.');r=panel(`<h2>Your scientific explanation</h2><p class="small">Use the terms ribosome, Golgi, and protein where appropriate.</p><textarea id="reflection" oninput="saveNotes(this.value)" placeholder="Ribosomes would still…">${esc(state.notes||'')}</textarea><div class="row">${button('Submit explanation',`submitNotes()`,'primary')}${button('Sentence starter',`starter()`)}</div><div class="feedback">${state.noteMsg||'Your response is saved locally. A teacher—not AI—would review it.'}</div>${state.done[10]?'<details><summary>Compare with an example explanation</summary><p>Ribosomes can continue assembling proteins, but a Golgi disruption can interfere with modification, sorting, and packaging of proteins intended for secretion.</p></details>':''}`);break;
case 11:l=left('FINAL CHECK','Show what you know','Answer five questions covering cell structures, membrane transport, protein delivery, energy, and plant cells.','Select an answer for every question, then click Submit assessment. You can retry after reviewing feedback.');let qs=[['Which organelle stores most of the cell’s DNA?',['Nucleus','Golgi','Ribosome'],0],['Which molecule can pass directly through the lipid bilayer most readily?',['Sodium ion','Oxygen','Glucose'],1],['Where are many proteins for secretion sorted and packaged?',['Nucleus','Chloroplast','Golgi'],2],['Which condition generally limits aerobic ATP production?',['Less oxygen','More oxygen','More glucose with adequate oxygen'],0],['Which structure captures light energy in photosynthetic plant cells?',['Mitochondrion','Chloroplast','Ribosome'],1]];r=panel(`<h2>Final assessment · 5 questions</h2>${qs.map((q,i)=>`<div class="task" style="margin-top:12px">${i+1}. ${q[0]}</div><div class="options">${q[1].map((x,j)=>button(x,`answer(${i},${j})`,state.assess[i]===j?'selected':'')).join('')}</div>`).join('')}${button('Submit assessment',`grade()`,'primary wide')}<div class="feedback ${state.gradeMsg&&state.score<4?'warn':''}" role="status">${state.gradeMsg||'Answer all five questions to submit.'}</div>${state.gradeMsg?`<div class="lesson-note"><b>Feedback by question</b><ol>${['Nucleus stores most nuclear DNA.','Oxygen diffuses directly through the lipid bilayer.','Golgi sorts and packages many secreted proteins.','Oxygen shortage generally reduces aerobic ATP production.','Chloroplasts capture light energy for photosynthesis.'].map((reason,i)=>`<li>${state.assess[i]===qs[i][2]?'Correct':'Review'} — ${reason}</li>`).join('')}</ol></div>`:''}`);break;
case 12:l=left('COMPLETED','Your cell investigation','You explored cellular systems, ran experiments, built a protein pathway, reflected on the evidence, and completed a final assessment.','Review your record or restart the lesson to explore again.');r=panel(`<h2>Your learning record</h2><div class="stats"><div class="stat"><b>${Object.keys(state.done).length}</b>Completed screens</div><div class="stat"><b>${state.score??'—'}/5</b>Assessment</div><div class="stat"><b>${(state.tests||[]).length}</b>Energy tests</div></div><h2>Reflection</h2><p>${esc(state.notes||'No reflection saved')}</p><div class="feedback">Prototype only: results are stored in this browser, not submitted to an LMS or teacher gradebook.</div>${button('Restart lesson',`restart()`,'primary wide')}`);break}
document.body.classList.toggle('lab-page',state.page===4);$('#intro').innerHTML=l;$('#activity').innerHTML=r;$('#fill').style.width=(100*state.page/(n-1))+'%';$('#count').textContent=`${state.page+1} / ${n} · ${titles[state.page]}`;$('#back').disabled=state.page===0;$('#next').disabled=state.page===n-1||!completed();$('#next').textContent=state.page===n-2?'View results →':'Next →';if(state.page===4)requestAnimationFrame(labInit);save()}
function explore(x){let messages={Nucleus:'The nucleus contains DNA, the instructions used to make RNA messages.',Mitochondrion:'Mitochondria are important sites of aerobic cellular respiration and ATP production.','Rough ER':'The rough ER helps process many proteins headed for membranes or secretion.',Golgi:'The Golgi modifies, sorts, and packages proteins.',Membrane:'The plasma membrane controls movement into and out of the cell.'};if(!state.mem.includes(x))state.mem.push(x);state.cellInfo=messages[x];if(state.mem.length>=3)state.done[2]=true;render()}
function chooseMol(x){state.lastTransport=null;state.molecule=x;state.memMsg='Selected '+x+'. Choose a pathway and run the trial.';state.memError=false;render()}
function chooseRoute(x){state.lastTransport=null;state.route=x;state.memMsg='Pathway selected. Run the trial to test your prediction.';state.memError=false;render()}
let transportRunId=0;
function transportPaint(progress,passed,molecule,route){const c=document.getElementById('membraneCanvas');if(!c)return;const ctx=c.getContext('2d');if(!ctx)return;const W=c.width,H=c.height;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#09263d');bg.addColorStop(1,'#051522');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#b5d3e5';ctx.font='bold 15px Segoe UI, sans-serif';ctx.fillText('OUTSIDE',26,29);ctx.fillText('CYTOPLASM',W-133,29);
const mid=W/2;for(let y=24;y<H-8;y+=24){for(const offset of [-19,19]){ctx.fillStyle='#6fe5d8';ctx.beginPath();ctx.arc(mid+offset,y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#48899d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mid+offset+(offset<0?6:-6),y+8);ctx.lineTo(mid+offset+(offset<0?6:-6),y+16);ctx.stroke();}}
const routeColors={'Ion channel':'#a78bfa','Glucose transporter':'#f9b86a','Through lipid bilayer':'#6fe5d8'};if(route&&route!=='Through lipid bilayer'){ctx.fillStyle=routeColors[route];ctx.strokeStyle='#f7f6ff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(mid-27,H/2-57,54,114,18);ctx.fill();ctx.stroke();ctx.fillStyle='#071c2d';ctx.beginPath();ctx.roundRect(mid-9,H/2-51,18,102,8);ctx.fill();}
const color=molecule==='Sodium ion'?'#ffbd74':molecule==='Glucose'?'#bcf57e':'#8abdf7';let move=passed?Math.min(1,progress)*W*.68:Math.min(.54,progress)*W*.29;
for(let i=0;i<9;i++){let sx=42+(i%3)*28,sy=75+Math.floor(i/3)*83+((i%2)*17);let x=sx+move; if(!passed&&progress>.55)x=sx+W*.29-(progress-.55)*100;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,sy,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffffa0';ctx.stroke();}
ctx.font='13px Segoe UI, sans-serif';ctx.fillStyle='#d7effa';ctx.fillText(molecule||'Choose a molecule',22,H-15);ctx.textAlign='right';ctx.fillText(route||'Choose a route',W-22,H-15);ctx.textAlign='left';}
